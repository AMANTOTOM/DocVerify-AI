name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t docverify-backend ./backend

  lint-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      SECRET_KEY: ci-test-secret-key-not-a-real-secret-123
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Check code style with ruff
        run: ruff check .

      - name: Unit tests
        run: pytest test_main.py test_unit.py -v

      - name: Integration tests
        run: pytest test_integration.py -v