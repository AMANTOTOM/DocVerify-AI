services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - qdrant
    environment:
      MONGO_URL: mongodb://mongo:27017
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    
    volumes:
      - uploads-data:/app/uploads

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend  

volumes:
  mongo-data:
  qdrant-data:
  uploads-data: